<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="icono.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sono:MONO@0..1&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <title>Cancionero</title>
    <style>
        header {
            max-width: 1000px;
            margin: 0 auto 30px auto;
        }

        h1 {
            margin: 0;
            font-size: 40px; /* Tamaño más grande para el título */
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.5px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 32px; /* Tamaño adaptado para pantallas pequeñas */
            }
        }

        p {
            margin: 5px 0 0 0;
            font-size: 13px;
            color: #888;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        /* Configuración de rejilla adaptativa */
        .lista-canciones {
            display: grid;
            grid-template-columns: 1fr; /* 1 columna por defecto (celulares) */
            gap: 16px;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Pantallas medianas (tablets / laptops pequeñas): 2 columnas */
        @media (min-width: 600px) {
            .lista-canciones {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Pantallas anchas (desktops): 3 columnas */
        @media (min-width: 900px) {
            .lista-canciones {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .fila-cancion {
            background-color: #1e1e24;
            border-radius: 10px;
            padding: 16px 20px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            transition: transform 0.15s, box-shadow 0.15s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .fila-cancion:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .fila-cancion h2 {
            margin: 0 0 12px 0;
            padding-bottom: 8px;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            border-bottom: 2px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Estilos para el icono de estado */
        .estado-icono {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-left: 10px;
            flex-shrink: 0;
        }

        .estado-icono.terminada {
            background-color: #2ec4b6; /* Verde / Turquesa */
            box-shadow: 0 0 8px rgba(46, 196, 182, 0.5);
        }

        .estado-icono.revisar {
            background-color: #f5c518; /* Amarillo */
            box-shadow: 0 0 8px rgba(245, 197, 24, 0.5);
        }

        .estado-icono.pendiente {
            background-color: #e71d36; /* Rojo */
            box-shadow: 0 0 8px rgba(231, 29, 54, 0.5);
        }

        .fila-cancion .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            font-size: 13px;
            color: #999;
        }

        .cargando {
            text-align: center;
            color: var(--accent);
            padding: 40px;
            font-family: 'Sono', monospace;
            grid-column: 1 / -1; /* Ocupa todo el ancho si está cargando */
        }
    </style>
</head>
<body>
    <header>
        <h1>Cancionero</h1>
        <p>Selecciona una canción.</p>
    </header>

    <main id="lista-canciones" class="lista-canciones">
        <div class="cargando">Cargando canciones...</div>
    </main>

    <script type="module">
        import { obtenerCanciones, obtenerContenidoCancion } from './js/api-cliente.js';
        import { detectarTonalidad, nombreTonalidad } from './js/modulo-transponer.js';

        const listaDiv = document.getElementById('lista-canciones');

        async function init() {
            try {
                const canciones = await obtenerCanciones();
                listaDiv.innerHTML = "";

                if (canciones.length === 0) {
                    listaDiv.innerHTML = "<div>Todavía no hay canciones registradas.</div>";
                    return;
                }

                for (const cancion of canciones) {
                    const fila = document.createElement('div');
                    fila.className = "fila-cancion";

                    fila.onclick = () => {
                        window.location.href = `visor?idC=${encodeURIComponent(cancion.idC)}`;
                    };

                    // La tonalidad se detecta a partir de los acordes del propio archivo
                    let tonalidad = '—';
                    try {
                        const datos = await obtenerContenidoCancion(cancion.idC);
                        if (datos.contenido) {
                            tonalidad = nombreTonalidad(detectarTonalidad(datos.contenido));
                        }
                    } catch (_) { /* si falla, se queda en — */ }

                    // Estado de la canción: terminada (verde), revisar (amarillo) o pendiente (rojo)
                    const claseEstado = cancion.estado || 'terminada';
                    const tituloEstado = {
                        terminada: 'Canción terminada',
                        revisar: 'Hay que revisarla',
                        pendiente: 'Canción no terminada'
                    }[claseEstado] || '';

                    fila.innerHTML = `
                        <h2>
                            <span>${cancion.nombreC}</span>
                            <span class="estado-icono ${claseEstado}" title="${tituloEstado}"></span>
                        </h2>
                        <div class="meta">
                            <span>Arreglos: ${cancion.arreglos || '—'}</span>
                            <span>Tonalidad: ${tonalidad}</span>
                        </div>
                    `;
                    listaDiv.appendChild(fila);
                }
            } catch (err) {
                listaDiv.innerHTML = "<div class='cargando'>Error al cargar el cancionero.</div>";
            }
        }

        init();
    </script>
</body>
</html>
