<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de Letra</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121214;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .visor-wrapper {
            max-width: 800px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Contenedor principal de la letra */
        .letra-contenedor {
            position: relative;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            width: 100%;
            box-sizing: border-box;
            overflow: hidden; /* Mantiene la marca de agua dentro de las esquinas redondeadas */
            z-index: 1;
        }

        /* Marca de agua fija centrada dentro de la tarjeta de la letra */
        .letra-contenedor::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 80%;
            background-image: url('fondo.png');
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            opacity: 0.18; /* Regula la transparencia (0.1 a 0.2 es recomendado) */
            pointer-events: none;
            z-index: 0;
        }

        /* Mantiene el contenido y texto por encima del fondo */
        .letra-texto {
            position: relative;
            z-index: 1;
            font-size: 1.1rem;
            line-height: 1.8;
            white-space: pre-wrap;
            color: #222;
        }

        .btn-volver {
            display: inline-block;
            padding: 10px 20px;
            background-color: #333;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            align-self: flex-start;
            transition: background 0.3s ease;
        }

        .btn-volver:hover {
            background-color: #555;
        }
    </style>
</head>
<body>

    <div class="visor-wrapper">
        <a href="index.html" class="btn-volver">&larr; Volver</a>
        
        <div class="letra-contenedor">
            <div class="letra-texto" id="letraTexto">
                <!-- Aquí se cargará la letra dinámicamente o puedes colocar el texto directo -->
            </div>
        </div>
    </div>

</body>
</html>
